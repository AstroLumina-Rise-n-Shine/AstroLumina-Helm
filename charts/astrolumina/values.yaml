# Shared defaults for the astrolumina chart. Environment-specific settings
# (namespace, replicas, probes, Traefik, Doppler
# project config) live in values-development/staging/production.yaml. This file holds
# what is IDENTICAL across environments: the service catalog, container
# image registry, resource budgets and the full secretKeyRef env wiring per
# service. Budgets are sized for the 2 GB lab workers: actual usage is
# ~100Mi per API pod and ~5Mi for nginx, so limits sit just above reality
# (blue+green x replicas must fit two workers alongside ArgoCD + system).
# (Compose-style variable names — the frontend entrypoint injects them into
# public/env.js, VITE_* names are NOT read by the image).
image:
  registry: ghcr.io/astrolumina-rise-n-shine
  # Ultimate fallback tag: dev prefers its per-service devTags (see
  # values-development.yaml) and only uses this when a service has no entry there.
  # Staging and production pin per-color tags in values-staging/production.yaml
  # (imageTags), mirroring the Compose versions.env files.
  tag: latest
  pullPolicy: Always
  pullSecret: ghcr-secret

# Ordered service catalog. `env` is the exact secretKeyRef wiring from the
# Kustomize deployments (name -> key, plus `optional: true` where the
# originals set it). Each service also carries its explicit `dopplerSync`
# key list (order matches the original 01-doppler-secrets.yaml), so the
# DopplerSecret manifests always carry exactly these keys.
services:
  - name: frontend
    component: frontend
    image: astrolumina-frontend
    containerPort: 8080
    servicePort: 80
    nodePort: 30080
    probePath: /
    requests:
      cpu: 25m
      memory: 16Mi
    limits:
      cpu: 200m
      memory: 64Mi
    env:
      - name: NODE_ENV
        key: NODE_ENV
      - name: FRONTEND_SERVER_PORT
        key: FRONTEND_SERVER_PORT
      - name: FRONTEND_SENTRY_DSN
        key: FRONTEND_SENTRY_DSN
      - name: STRIPE_PK
        key: STRIPE_PK
      - name: R2_BASE_URL
        key: R2_BASE_URL
      - name: ASTROLOGY_API_URL
        key: ASTROLOGY_API_K8S_URL
      - name: PAYMENT_API_URL
        key: PAYMENT_API_K8S_URL
      - name: BOOKING_API_URL
        key: BOOKING_API_K8S_URL
      - name: ASTROLOGY_API_SERVER_DC_PORT
        key: ASTROLOGY_API_SERVER_DC_PORT
