# Staging environment. Blue/green Deployments (1 replica each, blue on
# worker-01 / green on worker-02), ClusterIP *-live Services as the 4-line
# traffic switch, plain-HTTP Traefik IngressRoute, strict NetworkPolicy.
environment: staging
namespace: astrolumina-staging
# Values file name (used by NOTES.txt upgrade hints).
valuesFile: values-staging.yaml
blueGreen:
  enabled: true
  colors:
    - blue
    - green
  # Live color PER SERVICE -- each app flips independently (mirrors the
  # per-service *-live selectors in Kubernetes and the per-router LIVE
  # markers in Compose). Flip one service line at a time.
  liveColors:
    astrology-api: green # LIVE
    frontend: blue # LIVE
    payment-api: blue # LIVE
    booking-api: blue # LIVE
  nodeNames:
    blue: rke2-worker-daniel-pirvu-01
    green: rke2-worker-daniel-pirvu-02

# Pinned image tags per color (source of truth in git, mirrors the Compose
# staging versions.env — keep them in parity). Same value on both colors =
# current behavior; diverge them to stage a release on the idle color, then
# flip traffic with that service's blueGreen.liveColors entry.
imageTags:
  blue:
    astrology-api: 2.0.16
    frontend: 2.0.15
    payment-api: 2.0.11
    booking-api: 2.0.11
  green:
    astrology-api: 2.0.16
    frontend: 2.0.15
    booking-api: 2.0.11
    payment-api: 2.0.11

replicas: 1

probes:
  frontend:
    livenessDelay: 10
    readinessDelay: 5
  api:
    livenessDelay: 15
    readinessDelay: 10

hpa:
  minReplicas: 1
  maxReplicas: 3
  cpuUtilization: 70
  memoryUtilization: {}

exposure: live # traffic flows through the *-live ClusterIP Services

traefik:
  enabled: true
  host: staging.k8s.astrolumina.ro
  dashboardHost: dashboard.k8s.astrolumina.ro
  tls: false
  redirectHttp: false
  dashboardAuth: false
  certResolver: letsencrypt
  tlsDomain: ""

networkPolicy:
  strict: true

doppler:
  config: stg
  tokenSecret: doppler-token-stg
  namePrefix: astrolumina-staging
