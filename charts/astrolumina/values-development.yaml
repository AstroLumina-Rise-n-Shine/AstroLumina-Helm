# Development environment. Single Deployment per service (no blue/green),
# NodePort services straight to the LAN, no Traefik, permissive NetworkPolicy.
environment: development
namespace: astrolumina-development
# Values file name (used by NOTES.txt upgrade hints).
valuesFile: values-development.yaml
blueGreen:
  enabled: false
  colors:
    - blue
    - green
  # Per-service live colors, unused on dev (no *-live Services), kept for
  # schema parity with staging/production.
  liveColors:
    frontend: blue
    astrology-api: blue
    booking-api: blue
    payment-api: blue
  nodeNames: {} # no node affinity on dev

# Per-service image tags for dev (no blue/green here). The deployment
# template prefers these over the global image.tag fallback from values.yaml,
# so each service can be deployed at its own version.
devTags:
  frontend: 2.0.18
  astrology-api: 2.0.18
  booking-api: 2.0.13
  payment-api: 2.0.13

replicas: 1

# Probe delays only; period/timeout/threshold are constant across all envs
# (liveness 30s/10s/3, readiness 15s/5s/2) and live in the template.
probes:
  frontend:
    livenessDelay: 15
    readinessDelay: 10
  api:
    livenessDelay: 15
    readinessDelay: 10

hpa:
  minReplicas: 1
  maxReplicas: 3
  cpuUtilization: 70
  # Extra memory metric, service name -> utilization. Only dev scopes the
  # frontend on memory; staging/production use CPU only.
  memoryUtilization:
    frontend: 75
  # No prometheus-adapter on development (ArgoCD-only cluster): drop the
  # inherited Pods metric so the HPAs stay CPU(+memory)-only instead of
  # reporting a permanently-missing custom metric.
  requestsPerMinute: null

exposure: NodePort # dev reaches pods via NodePorts, no IngressRoutes

traefik:
  enabled: false
  host: ""
  dashboardHost: ""
  tls: false
  redirectHttp: false
  dashboardAuth: false
  certResolver: letsencrypt
  tlsDomain: ""

networkPolicy:
  strict: false # permissive dev policy (see template)

doppler:
  config: dev
  tokenSecret: doppler-token-dev
  namePrefix: astrolumina-development
