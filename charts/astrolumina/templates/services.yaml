{{/* Services. Dev exposes each Deployment directly via NodePort (no
Traefik). Staging/production expose only the stable *-live ClusterIP
Services — the blue-green switch is exactly these selectors. */}}
{{- $root := . }}
{{- range $svc := .Values.services }}
{{- if eq $root.Values.exposure "NodePort" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  namespace: {{ $root.Values.namespace }}
  labels:
{{ include "astrolumina.labels" (list $svc "" $root) | indent 4 }}
spec:
  type: NodePort
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
    - name: http
      port: {{ $svc.servicePort }}
      targetPort: http
      nodePort: {{ $svc.nodePort }}
      protocol: TCP
  selector:
{{ include "astrolumina.selector" (list $svc "") | indent 4 }}
{{- else }}
{{- $live := required (printf "blueGreen.liveColors has no entry for service '%s'" $svc.name) (index $root.Values.blueGreen.liveColors $svc.name) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}-live
  namespace: {{ $root.Values.namespace }}
  labels:
{{ include "astrolumina.labels" (list $svc "" $root) | indent 4 }}
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
    - name: http
      port: {{ $svc.servicePort }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ $svc.name }}
    app.kubernetes.io/component: {{ $svc.component }}
    variant: {{ $live }}
{{- end }}
{{- end }}
