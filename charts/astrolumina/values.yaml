# Shared defaults for the astrolumina chart. Environment-specific settings
# (namespace, replicas, probes, Traefik, placeholder secret values, Doppler
# project config) live in values-development/staging/production.yaml. This file holds
# what is IDENTICAL across environments: the service catalog, container
# image registry, resource budgets and the full secretKeyRef env wiring per
# service
# (Compose-style variable names — the frontend entrypoint injects them into
# public/env.js, VITE_* names are NOT read by the image).
image:
  registry: ghcr.io/astrolumina-rise-n-shine
  # Ultimate fallback tag: dev prefers its per-service devTags (see
  # values-development.yaml) and only uses this when a service has no entry there.
  # Staging and production pin per-color tags in values-staging/production.yaml
  # (imageTags), mirroring the Compose versions.env files.
  tag: latest
  pullPolicy: Always
  pullSecret: ghcr-secret

# Ordered service catalog. `env` is the exact secretKeyRef wiring from the
# Kustomize deployments (name -> key, plus `optional: true` where the
# originals set it). Each service also carries its explicit `dopplerSync`
# key list (order matches the original 01-doppler-secrets.yaml), so the
# placeholder Secrets and the DopplerSecret manifests both use these keys.
services:
  - name: frontend
    component: frontend
    image: astrolumina-frontend
    containerPort: 8080
    servicePort: 80
    nodePort: 30080
    probePath: /
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi
    env:
      - name: NODE_ENV
        key: NODE_ENV
      - name: FRONTEND_SERVER_PORT
        key: FRONTEND_SERVER_PORT
      - name: FRONTEND_SENTRY_DSN
        key: FRONTEND_SENTRY_DSN
      - name: STRIPE_PK
        key: STRIPE_PK
      - name: R2_BASE_URL
        key: R2_BASE_URL
      - name: ASTROLOGY_API_URL
        key: ASTROLOGY_API_K8S_URL
      - name: PAYMENT_API_URL
        key: PAYMENT_API_K8S_URL
      - name: BOOKING_API_URL
        key: BOOKING_API_K8S_URL
      - name: ASTROLOGY_API_SERVER_DC_PORT
        key: ASTROLOGY_API_SERVER_DC_PORT
      - name: ASTROLOGY_API_SERVER_DC_DNS
        key: ASTROLOGY_API_SERVER_DC_DNS
      - name: ASTROLOGY_API_SERVER_K8S_PORT
        key: ASTROLOGY_API_SERVER_K8S_PORT
      - name: ASTROLOGY_API_SERVER_K8S_DNS
        key: ASTROLOGY_API_SERVER_K8S_DNS
      - name: BOOKING_API_SERVER_DC_PORT
        key: BOOKING_API_SERVER_DC_PORT
      - name: BOOKING_API_SERVER_DC_DNS
        key: BOOKING_API_SERVER_DC_DNS
      - name: BOOKING_API_SERVER_K8S_PORT
        key: BOOKING_API_SERVER_K8S_PORT
      - name: BOOKING_API_SERVER_K8S_DNS
        key: BOOKING_API_SERVER_K8S_DNS
      - name: PAYMENT_API_SERVER_DC_PORT
        key: PAYMENT_API_SERVER_DC_PORT
      - name: PAYMENT_API_SERVER_DC_DNS
        key: PAYMENT_API_SERVER_DC_DNS
      - name: PAYMENT_API_SERVER_K8S_PORT
        key: PAYMENT_API_SERVER_K8S_PORT
      - name: PAYMENT_API_SERVER_K8S_DNS
        key: PAYMENT_API_SERVER_K8S_DNS
      - name: FRONTEND_SERVER_DC_PORT
        key: FRONTEND_SERVER_DC_PORT
      - name: FRONTEND_SERVER_DC_DNS
        key: FRONTEND_SERVER_DC_DNS
      - name: FRONTEND_SERVER_K8S_PORT
        key: FRONTEND_SERVER_K8S_PORT
      - name: FRONTEND_SERVER_K8S_DNS
        key: FRONTEND_SERVER_K8S_DNS
    # Exact DopplerSecret sync list for this service (order matches the
    # original 01-doppler-secrets.yaml). Only keys actually referenced by
    # the container env (or the pairs) are synced: the frontend reads the
    # app-facing _API_URL names from the _API_K8S_URL secret keys, so just
    # the K8s-side keys are listed — the unreferenced plain _API_URL and
    # _API_DC_URL keys are NOT synced.
    dopplerSync:
      - NODE_ENV
      - FRONTEND_SERVER_PORT
      - FRONTEND_SENTRY_DSN
      - STRIPE_PK
      - R2_BASE_URL
      - ASTROLOGY_API_K8S_URL
      - PAYMENT_API_K8S_URL
      - BOOKING_API_K8S_URL
      - ASTROLOGY_API_SERVER_DC_PORT
      - ASTROLOGY_API_SERVER_DC_DNS
      - ASTROLOGY_API_SERVER_K8S_PORT
      - ASTROLOGY_API_SERVER_K8S_DNS
      - BOOKING_API_SERVER_DC_PORT
