# Production environment. Same shape as staging plus: 3 replicas, slower
# probes, HTTPS via the letsencrypt certResolver, HTTP->HTTPS redirect and
# basic-auth on the Traefik dashboard. Live Stripe keys (placeholders here).
environment: production
namespace: astrolumina-production
# Values file name (used by NOTES.txt upgrade hints).
valuesFile: values-production.yaml
# Phase out the placeholder Secrets after the Doppler sync is verified:
# helm upgrade ... --set placeholderSecretsEnabled=false
placeholderSecretsEnabled: true

blueGreen:
  enabled: true
  colors:
    - blue
    - green
  # Live color PER SERVICE -- each app flips independently (mirrors the
  # per-service *-live selectors in Kubernetes and the per-router LIVE
  # markers in Compose). Flip one service line at a time.
  liveColors:
    frontend: blue # LIVE
    astrology-api: blue # LIVE
    booking-api: blue # LIVE
    payment-api: blue # LIVE
  nodeNames:
    blue: rke2-worker-daniel-pirvu-01
    green: rke2-worker-daniel-pirvu-02

# Pinned image tags per color (source of truth in git, mirrors the Compose
# production versions.env — keep them in parity). Same value on both colors =
# current behavior; diverge them to stage a release on the idle color, then
# flip traffic with that service's blueGreen.liveColors entry.
imageTags:
  blue:
    frontend: 2.0.15
    astrology-api: 2.0.16
    booking-api: 2.0.11
    payment-api: 2.0.11
  green:
    frontend: 2.0.15
    astrology-api: 2.0.16
    booking-api: 2.0.11
    payment-api: 2.0.11

replicas: 3

probes:
  frontend:
    livenessDelay: 10
    readinessDelay: 5
  api:
    livenessDelay: 40
    readinessDelay: 30

hpa:
  minReplicas: 3
  maxReplicas: 5
  cpuUtilization: 70
  memoryUtilization: {}

exposure: live # traffic flows through the *-live ClusterIP Services

traefik:
  enabled: true
  host: production.k8s.astrolumina.ro
  dashboardHost: dashboard.k8s.astrolumina.ro
  tls: true
  redirectHttp: true
  dashboardAuth: true
  certResolver: letsencrypt
  tlsDomain: production.k8s.astrolumina.ro

networkPolicy:
  strict: true

doppler:
  config: prd
  tokenSecret: doppler-token-prd
  namePrefix: astrolumina-production

# Placeholder Secret values (02-secrets.yaml equivalent). Fake but
