# CI for the Helm chart: lint, render, schema-check, scan.
# Runs on every push and pull request. Uses the preinstalled Helm on the
# GitHub runner (helm lint / helm template need no cluster).
---
name: Helm CI

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

env:
  CHART: ./charts/astrolumina
  KUBECONFORM_VERSION: v0.8.0
  KUBELINTER_VERSION: v0.8.3

jobs:
  # YAML style for Chart and values files. The templates/ directory holds
  # Go templating, not plain YAML, so it is excluded here and validated by
  # rendering it instead (see helm-template below).
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install yamllint==1.38.0
      - run: yamllint charts/astrolumina/Chart.yaml charts/astrolumina/values.yaml charts/astrolumina/values-development.yaml charts/astrolumina/values-staging.yaml charts/astrolumina/values-production.yaml

  # Chart lint plus a full render per environment. Rendered output is kept
  # for the schema and policy jobs below.
  helm-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: helm version --short
      - name: Lint and render all environments
        run: |
          mkdir -p /tmp/helmrender
          for env in development staging production; do
            helm lint "$CHART" --values "$CHART/values-$env.yaml"
            helm template release "$CHART" --values "$CHART/values-$env.yaml" --namespace "astrolumina-$env" > "/tmp/helmrender/$env.yaml"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helm-render
          path: /tmp/helmrender/

  # Strict schema validation of the rendered manifests. CRDs served by
  # in-cluster operators (Doppler, Traefik) are skipped - no public schema
  # exists for them.
  kubeconform:
    runs-on: ubuntu-latest
    needs: helm-template
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: helm-render
          path: /tmp/helmrender
      - name: Install kubeconform
        run: >
          curl -sL -o kubeconform.tar.gz
          "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          && tar xzf kubeconform.tar.gz kubeconform && sudo install kubeconform /usr/local/bin/kubeconform
      - run: kubeconform -summary -skip DopplerSecret,IngressRoute,Middleware /tmp/helmrender/development.yaml
      - run: kubeconform -summary -skip DopplerSecret,IngressRoute,Middleware /tmp/helmrender/staging.yaml
      - run: kubeconform -summary -skip DopplerSecret,IngressRoute,Middleware /tmp/helmrender/production.yaml

  # Best-practice policy check on the rendered manifests. Four checks are
  # excluded with justification in .kube-linter.yaml.
  kube-linter:
    runs-on: ubuntu-latest
    needs: helm-template
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: helm-render
          path: /tmp/helmrender
      - name: Install kube-linter
        run: >
          curl -sL -o kube-linter.tar.gz
          "https://github.com/stackrox/kube-linter/releases/download/${KUBELINTER_VERSION}/kube-linter-linux.tar.gz"
          && tar xzf kube-linter.tar.gz kube-linter && sudo install kube-linter /usr/local/bin/kube-linter
      - run: kube-linter lint --config .kube-linter.yaml --format plain /tmp/helmrender/development.yaml
      - run: kube-linter lint --config .kube-linter.yaml --format plain /tmp/helmrender/staging.yaml
      - run: kube-linter lint --config .kube-linter.yaml --format plain /tmp/helmrender/production.yaml

  # Misconfiguration scan. Currently clean, so it gates the build on
  # HIGH/CRITICAL. Findings upload to the Security tab via SARIF.
  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # Secret scan with the pinned OSS binary (the official action needs a paid
  # license on org repos). Full-history scan; the chart placeholder secret
  # is allowlisted in .gitleaks.toml.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: >
          curl -sL -o gitleaks.tar.gz
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          && tar xzf gitleaks.tar.gz gitleaks && sudo install gitleaks /usr/local/bin/gitleaks
      - run: gitleaks detect --source . --config .gitleaks.toml --verbose --exit-code 1
