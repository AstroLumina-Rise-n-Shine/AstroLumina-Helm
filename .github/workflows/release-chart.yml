name: Release Chart

# Packages charts/astrolumina and pushes it to GitHub Container Registry as
# an OCI artifact (oci://ghcr.io/astrolumina-rise-n-shine/charts).
# Answers the "can this chart live in a Helm repository" question: GHCR *is*
# the repository -- no chartmuseum needed, `helm push/pull` speak OCI
# natively. OCI references are lowercase, hence the lowercase org name below
# (the GitHub org itself is AstroLumina-Rise-n-Shine).
#
# Release discipline: bump `version:` in charts/astrolumina/Chart.yaml, merge
# to main, this workflow publishes astrolumina-<version>.tgz. Re-pushing an
# existing version fails loudly (OCI tags are immutable) -- bump the version
# instead of retrying. Manual runs are for retrying a failed publish only,
# never for cutting a release without a version bump.
# ArgoCD keeps consuming the git path (charts/astrolumina + values files);
# the OCI artifact is for portability (other clusters, `helm pull`
# inspection), not a second source of truth.

on:
  push:
    branches: [main]
    paths: ['charts/**']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Package and push chart to GHCR
        run: |
          helm version --short
          ver=$(awk '/^version:/ {print $2}' charts/astrolumina/Chart.yaml)
          echo "Releasing chart version: $ver"
          helm package charts/astrolumina -d /tmp/chartpkg
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "/tmp/chartpkg/astrolumina-$ver.tgz" oci://ghcr.io/astrolumina-rise-n-shine/charts
