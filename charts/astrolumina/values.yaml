# HPA defaults shared/overridden per environment. min/max/target also live
# in the values-<env>.yaml files. Optional per-pod Pods metric, served by
# the prometheus-adapter: service name -> averageValue. The APIs scale on
# api_requests_per_minute (counts exclude /health); the frontend scales on
# frontend_requests_per_minute (nginx_http_requests_total, all requests).
# Services without an entry get no Pods metric.
hpa:
  minReplicas: 1
  maxReplicas: 3
  cpuUtilization: 70
  memoryUtilization: {}
  requestsPerMinute:
    astrology-api: 20
    booking-api: 20
    payment-api: 20

# nginx-prometheus-exporter sidecar for the frontend: scrapes Nginx
# stub_status on 127.0.0.1 and re-exposes nginx_http_requests_total etc.
# on :9113 for the frontend ServiceMonitor. Staging/production only —
# development runs ArgoCD alone (no monitoring), so it keeps this off.
frontendMetrics:
  enabled: false
  image: docker.io/nginx/nginx-prometheus-exporter:1.5.3
  port: 9113
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 50m
    memory: 32Mi

# Defaults so a bare `helm lint`/`helm template` (no -f values file)
# renders. Every values-<env>.yaml sets the real values.
exposure: NodePort
blueGreen:
  enabled: false
  liveColors: {}
networkPolicy:
  strict: false

# Optional namespaced human RBAC (developer/tester groups). Off by default:
# with rbac.enabled=false the rbac.yaml template renders nothing, so existing
# releases are unchanged. Development/staging enable it, production keeps it
# off on purpose (no human RoleBinding in production). Namespaced Role +
# RoleBinding only; the chart never creates a ServiceAccount or a
# ClusterRole/Binding, and never grants Secrets, exec or pod deletion.
# The group names must match the group claim issued by the cluster OIDC
# provider (kube-apiserver --oidc-groups-claim); mapping users into the groups
# is a cluster prerequisite.
rbac:
  enabled: false
  # Development only: let the developer group create/update/patch/delete
  # Deployments, Services, ConfigMaps, HPAs and NetworkPolicies. Keep false
  # everywhere else - staging and production developers stay read-only.
  developerWrite: false
  groups:
    developers: astrolumina:developers
    testers: astrolumina:testers
namespace: astrolumina
environment: development
traefik:
  enabled: false
  host: ""
  dashboardHost: ""
  tls: false
  redirectHttp: false
  dashboardAuth: false
  certResolver: letsencrypt
  tlsDomain: ""
doppler:
  config: dev
  tokenSecret: doppler-token-dev
  namePrefix: astrolumina-dev
probes:
  frontend:
    livenessDelay: 15
    readinessDelay: 10
  api:
    livenessDelay: 15
    readinessDelay: 10
