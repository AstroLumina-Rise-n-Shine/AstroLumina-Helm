{{/* Deployments: one per service on dev, blue+green per service on
staging/production. Only replicas, probe delays and node affinity vary per
environment — everything else comes from the shared service catalog. */}}
{{- $root := . }}
{{- $colors := list "" }}
{{- if .Values.blueGreen.enabled }}{{ $colors = list "blue" "green" }}{{ end }}
{{- range $svc := .Values.services }}
{{- range $color := $colors }}
{{- $name := include "astrolumina.workloadName" (list $svc $color) }}
{{- $probes := $root.Values.probes.api }}
{{- if eq $svc.name "frontend" }}{{ $probes = $root.Values.probes.frontend }}{{ end }}
{{- $node := "" }}
{{- if $root.Values.blueGreen.enabled }}{{ $node = index $root.Values.blueGreen.nodeNames $color }}{{ end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $root.Values.namespace }}
  annotations:
    secrets.doppler.com/reload: "true"
  labels:
{{ include "astrolumina.labels" (list $svc $color $root) | indent 4 }}
spec:
  replicas: {{ $root.Values.replicas }}
  selector:
    matchLabels:
{{ include "astrolumina.selector" (list $svc $color) | indent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
{{ include "astrolumina.labels" (list $svc $color $root) | indent 8 }}
    spec:
      imagePullSecrets:
        - name: {{ $root.Values.image.pullSecret }}
      {{- $runUser := 1001 }}
      {{- if eq $svc.name "frontend" }}{{ $runUser = 101 }}{{ end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: {{ $runUser }}
        runAsGroup: {{ $runUser }}
      volumes:
        - name: tmp-vol
          emptyDir: {}
        {{- if eq $svc.name "frontend" }}
        - name: nginx-logs
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        {{- end }}
      {{- if $node }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - {{ $node }}
      {{- end }}
      containers:
        - name: {{ $svc.name }}
          {{- $tag := $root.Values.image.tag }}
          {{- if $color }}{{ $tag = index (index $root.Values.imageTags $color) $svc.name }}{{ end }}
          {{- if and (not $color) $root.Values.devTags (hasKey $root.Values.devTags $svc.name) }}{{ $tag = index $root.Values.devTags $svc.name }}{{ end }}
          image: {{ $root.Values.image.registry }}/{{ $svc.image }}:{{ $tag }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            {{- if ne $svc.name "frontend" }}
            readOnlyRootFilesystem: true
            {{- end }}
          volumeMounts:
            - name: tmp-vol
              mountPath: /tmp
            {{- if eq $svc.name "frontend" }}
            - name: nginx-logs
              mountPath: /var/log/nginx
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $svc.containerPort }}
              protocol: TCP
          env:
{{- range $e := $svc.env }}
            - name: {{ $e.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "astrolumina.secretName" (list $svc) }}
                  key: {{ $e.key }}
{{- if $e.optional }}
                  optional: true
{{- end }}
{{- end }}
          resources:
            requests:
              cpu: {{ $svc.requests.cpu }}
              memory: {{ $svc.requests.memory }}
            limits:
              cpu: {{ $svc.limits.cpu }}
              memory: {{ $svc.limits.memory }}
          livenessProbe:
            httpGet:
              path: {{ $svc.probePath }}
              port: http
            initialDelaySeconds: {{ $probes.livenessDelay }}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ $svc.probePath }}
              port: http
            initialDelaySeconds: {{ $probes.readinessDelay }}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 2
        {{- if and (eq $svc.name "frontend") $root.Values.frontendMetrics.enabled }}
        # nginx-prometheus-exporter sidecar: turns Nginx stub_status into
        # Prometheus counters (nginx_http_requests_total, connections, ...)
        # on :9113 — scraped by the frontend ServiceMonitor (staging and
        # production only).
        - name: nginx-metrics
          image: {{ $root.Values.frontendMetrics.image }}
          imagePullPolicy: IfNotPresent
          args:
            - -nginx.scrape-uri=http://127.0.0.1:{{ $svc.containerPort }}/stub_status
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: metrics
              containerPort: {{ $root.Values.frontendMetrics.port }}
              protocol: TCP
          resources:
            requests:
              cpu: {{ $root.Values.frontendMetrics.requests.cpu }}
              memory: {{ $root.Values.frontendMetrics.requests.memory }}
            limits:
              cpu: {{ $root.Values.frontendMetrics.limits.cpu }}
              memory: {{ $root.Values.frontendMetrics.limits.memory }}
        {{- end }}
      restartPolicy: Always
{{- end }}
{{- end }}
