{{/* IngressRoutes: single-host routing mirroring the Compose routers — one
host, /api/* prefixes stripped before the apps, traffic to the *-live
Services. RKE2 Traefik only processes routes carrying the ingress.class
annotation (the installed CRD schema has no ingressClassName field).
Production serves HTTPS only (no plain HTTP at all) plus TLS via the
letsencrypt certResolver; the dashboard twin lives on websecure + basicAuth
there. */}}
{{- if .Values.traefik.enabled }}
{{- $host := .Values.traefik.host }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: astrolumina
  namespace: {{ .Values.namespace }}
  annotations:
    kubernetes.io/ingress.class: traefik
  labels:
    app.kubernetes.io/part-of: astrolumina
    environment: {{ .Values.environment }}
spec:
  entryPoints:
    {{- if .Values.traefik.tls }}
    - websecure
    {{- else }}
    - web
    {{- end }}
  routes:
    - match: Host(`{{ $host }}`) && PathPrefix(`/api/astrology`)
      kind: Rule
      middlewares:
        - name: security-headers
        - name: compress
        - name: strip-astrology
      services:
        - name: astrology-api-live
          port: 3031
    - match: Host(`{{ $host }}`) && PathPrefix(`/api/booking`)
      kind: Rule
      middlewares:
        - name: security-headers
        - name: compress
        - name: strip-booking
      services:
        - name: booking-api-live
          port: 3033
    - match: Host(`{{ $host }}`) && PathPrefix(`/api/payment`)
      kind: Rule
      middlewares:
        - name: security-headers
        - name: compress
        - name: strip-payment
      services:
        - name: payment-api-live
          port: 3032
    - match: Host(`{{ $host }}`)
      kind: Rule
      middlewares:
        - name: security-headers
        - name: compress
      services:
        - name: frontend-live
          port: 80
{{- if .Values.traefik.tls }}
  tls:
    certResolver: {{ .Values.traefik.certResolver }}
    domains:
      - main: {{ .Values.traefik.tlsDomain }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: {{ .Values.namespace }}
  annotations:
    kubernetes.io/ingress.class: traefik
  labels:
    app.kubernetes.io/part-of: astrolumina
    environment: {{ .Values.environment }}
spec:
  entryPoints:
{{- if .Values.traefik.tls }}
    - websecure
{{- else }}
    - web
{{- end }}
  routes:
    - match: Host(`{{ .Values.traefik.dashboardHost }}`)
      kind: Rule
{{- if .Values.traefik.dashboardAuth }}
      middlewares:
        - name: dashboard-auth
{{- end }}
      services:
        - name: api@internal
          kind: TraefikService
{{- if .Values.traefik.tls }}
  tls:
    certResolver: {{ .Values.traefik.certResolver }}
    domains:
      - main: {{ .Values.traefik.dashboardHost }}
{{- end }}
{{- end }}
